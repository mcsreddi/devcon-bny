server:
  port: 8080

spring:
  application:
    name: order-service

inventory:
  service:
    url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true   # publishes _bucket series for the Grafana p50/p95/p99 panels

logging:
  level:
    com.bny.spark26: INFO

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4318
  service:
    name: order-service

global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # Scrape the OTel Collector's Prometheus exporter (app metrics forwarded here)
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Collector's own internal metrics
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']

  # Direct scrape of order-service actuator/prometheus endpoint
  # (works even before OTel is wired up — attendees start here)
  - job_name: 'order-service'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/actuator/prometheus'

  - job_name: 'inventory-service'
    static_configs:
      - targets: ['host.docker.internal:8081']
    metrics_path: '/actuator/prometheus'

server:
  port: 8080

spring:
  application:
    name: order-service

inventory:
  service:
    url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
# LAB STEP 2: uncomment to enable Prometheus metrics + latency histograms (Grafana p50/p95/p99 panels)
#  metrics:
#    export:
#      prometheus:
#        enabled: true
#    distribution:
#      percentiles-histogram:
#        http.server.requests: true

logging:
  level:
    com.bny.spark26: INFO


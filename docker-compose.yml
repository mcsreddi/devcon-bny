version: '3.8'

services:

  # ─── OpenTelemetry Collector ────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.98.0
    container_name: otel-collector
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver  (your app sends here)
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Collector self-metrics
      - "8889:8889"   # Prometheus scrape target for collector metrics
    depends_on:
      - prometheus
      - jaeger

  # ─── Jaeger (distributed tracing UI) ────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI  →  http://localhost:16686
      - "14250:14250"  # gRPC

  # ─── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    volumes:
      - ./otel/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"    # Prometheus UI  →  http://localhost:9090
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'

  # ─── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./otel/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./otel/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./otel/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"    # Grafana UI  →  http://localhost:3000
    depends_on:
      - prometheus
